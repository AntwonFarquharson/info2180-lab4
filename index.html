<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avengers Character Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>AVENGERS CHARACTER SEARCH</h1>
  
  <div class="search-container">
    <label for="query">Search by Full Name or Alias</label>
    <div class="input-group">
      <input type="text" id="query" placeholder="e.g. Captain America or Steve Rogers">
      <button id="searchBtn">Search</button>
    </div>
  </div>

  <div id="result">
    <!-- Search results will go here -->
  </div>

  <script src="app.js"></script>
</body>
</html>
